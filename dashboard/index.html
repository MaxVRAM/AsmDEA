<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assembly D.E.A · Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // No-FOUC bootstrap: re-apply the last selected scheme's CSS variables
      // synchronously before React mounts. Falls back to the GitHub Dark
      // defaults baked into :root (src/index.css) on first-ever visit.
      (function () {
        try {
          var cached = JSON.parse(localStorage.getItem('asmdea:colour-vars') || 'null')
          if (cached && cached.vars) {
            var root = document.documentElement
            for (var prop in cached.vars) root.style.setProperty(prop, cached.vars[prop])
            if (cached.colorScheme) root.style.colorScheme = cached.colorScheme
          }
        } catch (e) { /* ignore */ }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
