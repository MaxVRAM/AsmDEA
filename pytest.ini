[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
testpaths = tests
addopts = 
    -v
    --strict-markers
    --tb=short

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for full workflows
    slow: Tests that take a long time to run
